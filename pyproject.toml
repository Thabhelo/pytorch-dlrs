[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-dlrs"
version = "0.3.0.dev0"
description = "Dynamic Learning Rate Scheduler for PyTorch"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Thabhelo", email = "thabhelo@deepubuntu.com"}
]
maintainers = [
    {name = "Thabhelo", email = "thabhelo@deepubuntu.com"}
]
keywords = [
    "pytorch",
    "deep-learning",
    "machine-learning",
    "learning-rate",
    "scheduler",
    "optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
test = [
    "numpy>=1.21.0,<2; python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13'",
    "pytest>=7.0.0,<9",
    "pytest-cov>=4.0.0,<7",
]
dev = [
    "numpy>=1.21.0,<2; python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13'",
    "pytest>=7.0.0,<9",
    "pytest-cov>=4.0.0,<7",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
examples = [
    "numpy>=1.21.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/Thabhelo/pytorch-dlrs"
Documentation = "https://github.com/Thabhelo/pytorch-dlrs/blob/main/README.md"
Repository = "https://github.com/Thabhelo/pytorch-dlrs"
Issues = "https://github.com/Thabhelo/pytorch-dlrs/issues"

[tool.setuptools]
packages = ["dlrs"]

[tool.setuptools.package-data]
dlrs = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["dlrs"]

[tool.mypy]
# Type-check against the tooling interpreter; old-Python syntax/runtime support
# is checked by the actual Python 3.8/3.9 jobs in CI, not modern torch's stubs.
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torchvision.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["dlrs"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
