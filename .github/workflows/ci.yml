name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / torch ${{ matrix.torch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Representative version boundaries, not an assertion that every possible
      # Python/PyTorch/OS combination has compatible upstream wheels.
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.8', torch: '2.0.0'}
          - {os: ubuntu-22.04, python: '3.9', torch: '2.4.1'}
          - {os: ubuntu-latest, python: '3.10', torch: '2.5.1'}
          - {os: ubuntu-latest, python: '3.11', torch: '2.6.0'}
          - {os: ubuntu-latest, python: '3.12', torch: '2.14.1'}
          - {os: ubuntu-latest, python: '3.12', torch: latest}
          - {os: ubuntu-latest, python: '3.14', torch: '2.14.1'}
          - {os: macos-latest, python: '3.12', torch: '2.14.1'}
          - {os: windows-latest, python: '3.11', torch: '2.6.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install selected PyTorch and package
        shell: bash
        env:
          TORCH_VERSION: ${{ matrix.torch }}
        run: |
          python -m pip install --upgrade pip
          torch_spec="torch==$TORCH_VERSION"
          if [ "$TORCH_VERSION" = latest ]; then torch_spec="torch"; fi
          if [ "$RUNNER_OS" = macOS ]; then
            python -m pip install "$torch_spec"
          else
            python -m pip install "$torch_spec" --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e '.[test]'
          python -m pip check
          python -c 'import platform, torch; print(platform.platform(), platform.python_version(), torch.__version__)'
      - name: Run tests
        shell: bash
        run: |
          # These CI process groups stay on one host. Select macOS loopback
          # explicitly instead of relying on Gloo's default device selection.
          if [ "$RUNNER_OS" = macOS ]; then
            export GLOO_SOCKET_IFNAME=lo0
          fi
          python -m pytest tests --maxfail=1 \
            --basetemp="$RUNNER_TEMP/dlrs-pytest" \
            --cov=dlrs --cov-report=xml --cov-report=term-missing \
            --junitxml=pytest-results.xml
      - name: Retain test outcomes and capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}-torch${{ matrix.torch }}
          path: pytest-results.xml
      - name: Retain distributed worker diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-torch${{ matrix.torch }}
          path: |
            ${{ runner.temp }}/dlrs-pytest/**/rank-*-progress.json
            ${{ runner.temp }}/dlrs-pytest/**/rank-*.txt
          if-no-files-found: ignore
      - name: Save coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Current upstream annotations include tensor learning rates. Older
      # releases remain covered by the separate runtime compatibility matrix.
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' ruff==0.17.1 mypy==2.4.0
      - run: ruff check dlrs tests examples benchmarks setup.py .github/scripts
      - run: mypy dlrs

  lightning:
    name: Lightning CPU train and checkpoint resume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' pytorch-lightning==2.6.6
      - run: python -m pip check
      - name: Require the intended framework versions (no optional-test skip)
        run: |
          python -c "import torch, pytorch_lightning as pl; assert torch.__version__.split('+')[0] == '2.14.1'; assert pl.__version__ == '2.6.6'"
      - name: Compare uninterrupted and restored training in fresh processes
        run: >-
          python -m pytest
          tests/test_integrations.py::test_real_lightning_epoch_checkpoint_resume_in_fresh_processes
          tests/test_training_modes.py::test_real_lightning_rejects_unsupported_modes_before_optimizer_updates
          -v

  correctness:
    name: Mathematical contract and mutation audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' z3-solver==5.3.1.0
      - run: python -m pip check
      - name: Require the reviewed solver version
        run: python -c "import importlib.metadata, z3; assert importlib.metadata.version('z3-solver') == '5.3.1.0'; print(z3.get_full_version())"
      - name: Verify nonvacuous model obligations and audit guards
        run: |
          python benchmarks/verify_contract.py --output "$RUNNER_TEMP/contract-proofs"
          python -m pytest tests/test_contract_proofs.py tests/test_mutation_audit.py -q
      - name: Require detection of every declared deliberate defect
        run: python benchmarks/audit_mutations.py --output "$RUNNER_TEMP/mutation-audit"
      - name: Retain queries, mutations and raw test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-audit
          path: |
            ${{ runner.temp }}/contract-proofs/
            ${{ runner.temp }}/mutation-audit/

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    needs: [test, quality, lightning, correctness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: Build source distribution and wheel
        run: |
          python -m build
          python -m twine check dist/*
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must be v<package version>'
          PY
      - name: Test both installed distributions outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/dlrs-install"
          test_python="$RUNNER_TEMP/dlrs-install/bin/python"
          "$test_python" -m pip install --upgrade pip
          "$test_python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            "$test_python" -m pip install "${wheel}[test]"
          done
          python .github/scripts/validate_distributions.py --python "$test_python" --dist dist --output "$RUNNER_TEMP/distribution-validation"
      - name: Retain distribution validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-validation
          path: ${{ runner.temp }}/distribution-validation/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  publish:
    name: Publish verified artifacts to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
